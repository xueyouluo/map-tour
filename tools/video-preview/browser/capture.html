<!doctype html><meta charset="utf-8" /><link rel="icon" href="data:," /><style>
  html,
  body,
  #map {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
</style>
<div id="map"></div>
<script type="module">
  const config = await fetch('/api/config').then((r) => r.json());
  window._AMapSecurityConfig = {
    serviceHost: location.origin + '/_AMapService'
  };
  await new Promise((resolve, reject) => {
    window.amapLoaded = resolve;
    const s = document.createElement('script');
    s.src =
      'https://webapi.amap.com/maps?v=2.0&key=' +
      encodeURIComponent(config.amapKey) +
      '&callback=amapLoaded';
    s.onerror = reject;
    document.head.append(s);
  });
  const map = new AMap.Map('map', {
    viewMode: '2D',
    zoom: 10,
    center: [110, 30],
    layers: [new AMap.TileLayer.Satellite()],
    animateEnable: false,
    showLabel: false,
    showIndoorMap: false
  });
  await new Promise((r) => map.on('complete', r));
  window.captureDetail = async (p) => {
    map.setZoomAndCenter(p.zoom, p.center, true);
    await new Promise((r) => setTimeout(r, 1800));
    return {
      zoom: map.getZoom(),
      center: [map.getCenter().lng, map.getCenter().lat],
      corners: [
        [64, 64],
        [2112, 2112]
      ].map((p) => {
        const c = map.containerToLngLat(new AMap.Pixel(...p));
        return [c.lng, c.lat];
      })
    };
  };
  window.snapshotReady = true;
</script>
